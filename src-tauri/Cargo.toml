[package]
name = "orangehub"
version = "1.1.5"
description = "OrangeHub - Unified remote & database client"
authors = ["OrangeHub"]
license = "CC-BY-NC-SA-4.0"
edition = "2021"
rust-version = "1.94"

[lib]
name = "orangehub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-updater = "2.14"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
base64 = "0.23"
log = "0.4"
env_logger = "0.11"

# --- secret storage (pure rust, no C toolchain) ---
aes-gcm = "0.11"
argon2 = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
getrandom = "0.4"
subtle = "2"

# --- built-in application database ---
# NOTE: `rusqlite` cannot coexist with `sqlx-sqlite` because both link the
# native `sqlite3` library (libsqlite3-sys `links` conflict). We therefore use
# sqlx's bundled SQLite as the single SQLite implementation in the process —
# it backs both the application metadata store and user SQLite connections.

# --- ssh / sftp ---
russh = { version = "0.63", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.1"

# --- ftp / ftps ---
suppaftp = { version = "12.2", default-features = false, features = ["tokio", "tokio-rustls-ring", "async-secure"] }

# --- sql (mysql / tidb / postgres / sqlite) ---
sqlx = { version = "0.9", default-features = false, features = [
    "any",
    "runtime-tokio",
    "tls-rustls-ring",
    "mysql",
    "postgres",
    "sqlite-bundled",
    "chrono",
    "uuid",
    "json",
    "bigdecimal",
] }
url = "2"
webpki-roots = "1"
reqwest = { version = "0.13", features = ["json", "stream"] }

# --- redis ---
redis = { version = "1.7", default-features = false, features = [
    "tokio-comp",
    "tokio-rustls-comp",
    "tls-rustls-webpki-roots",
    "connection-manager",
    "json",
    "script",
    "streams",
    "geospatial",
    "acl",
    "cluster-async",
    "num-bigint",
] }

# --- mongodb ---
mongodb = { version = "3.9", default-features = false, features = [
    "rustls-tls",
    "dns-resolver",
    "compat-3-0-0",
] }

# --- Docker Engine API ---
# Supports TCP, Unix sockets, and Windows named pipes.
bollard = { version = "0.21", features = ["webpki"] }

# --- additional enterprise SQL protocols ---
# SQLx does not ship MSSQL or Oracle drivers. Keep these protocol clients
# separate from the SQLx-backed MySQL/PostgreSQL/SQLite path.
tiberius = { version = "0.13", default-features = false, features = ["tds73", "tokio", "rustls", "rustls-webpki-roots"] }
oracle-rs = "0.1.7"

[profile.dev]
incremental = true
opt-level = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
