name: Build OrangeHub

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact: OrangeHub-Windows-installers
          - platform: macos
            os: macos-latest
            artifact: OrangeHub-macOS
          - platform: linux
            os: ubuntu-24.04
            artifact: OrangeHub-Linux-packages
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev \
            patchelf rpm wget

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Linux Tauri CLI binding
        if: matrix.platform == 'linux'
        run: npm install --no-save --package-lock=false --ignore-scripts @tauri-apps/cli-linux-x64-gnu@2.12.3

      - name: Install macOS Tauri CLI binding
        if: matrix.platform == 'macos'
        run: npm install --no-save --package-lock=false --ignore-scripts @tauri-apps/cli-darwin-arm64@2.12.3

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Rust targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Prepare macOS signing
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_CERTIFICATE:-}" ]]; then
            echo "No Apple Developer certificate configured; using an explicit ad-hoc signature."
            exit 0
          fi
          if [[ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]]; then
            echo "APPLE_CERTIFICATE_PASSWORD is required when APPLE_CERTIFICATE is configured."
            exit 1
          fi
          if [[ -z "${APPLE_ID:-}" || -z "${APPLE_PASSWORD:-}" || -z "${APPLE_TEAM_ID:-}" ]] &&
             [[ -z "${APPLE_API_KEY:-}" || -z "${APPLE_API_ISSUER:-}" || -z "${APPLE_API_KEY_PATH:-}" ]]; then
            echo "Developer ID builds must also provide Apple notarization credentials."
            exit 1
          fi

      - name: Build application bundles
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            windows)
              npx tauri build --bundles nsis,msi
              ;;
            macos)
              if [[ -z "${APPLE_CERTIFICATE:-}" ]]; then
                export APPLE_SIGNING_IDENTITY=-
              elif [[ -z "${APPLE_SIGNING_IDENTITY:-}" ]]; then
                unset APPLE_SIGNING_IDENTITY
              fi
              npx tauri build --target aarch64-apple-darwin --bundles dmg
              npx tauri build --target x86_64-apple-darwin --bundles dmg
              ;;
            linux)
              npx tauri build --bundles deb,rpm
              ;;
          esac
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}

      - name: Verify macOS code signatures
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          for app in \
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/OrangeHub.app \
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/OrangeHub.app; do
            if [[ ! -d "$app" ]]; then
              echo "Expected macOS app bundle was not produced: $app"
              exit 1
            fi
            codesign --verify --deep --strict --verbose=2 "$app"
          done

      - name: Prepare portable Windows executable
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "src-tauri\target\release\orangehub.exe"
          $portableDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri\target\release\OrangeHub-Portable"
          $portableZip = Join-Path $env:GITHUB_WORKSPACE "src-tauri\target\release\OrangeHub-Portable.zip"
          if (-not (Test-Path $source)) { throw "Portable executable was not produced: $source" }
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item -Path $source -Destination (Join-Path $portableDir "OrangeHub.exe") -Force
          Compress-Archive -Path (Join-Path $portableDir "*") -DestinationPath $portableZip -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/aarch64-apple-darwin/release/bundle/**
            src-tauri/target/x86_64-apple-darwin/release/bundle/**
            src-tauri/target/release/OrangeHub-Portable.zip
          if-no-files-found: error
          retention-days: 14
