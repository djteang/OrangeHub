name: Build Windows installers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows installers
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Prepare portable executable
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "src-tauri\target\release\orangehub.exe"
          $portableDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri\target\release\OrangeHub-Portable"
          $portableZip = Join-Path $env:GITHUB_WORKSPACE "src-tauri\target\release\OrangeHub-Portable.zip"
          if (-not (Test-Path $source)) { throw "Portable executable was not produced: $source" }
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item -Path $source -Destination (Join-Path $portableDir "OrangeHub.exe") -Force
          Compress-Archive -Path (Join-Path $portableDir "*") -DestinationPath $portableZip -Force

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeHub-Windows-installers
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/release/OrangeHub-Portable.zip
          if-no-files-found: error
          retention-days: 14
