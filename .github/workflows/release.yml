name: Release OrangeHub

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release versions
        shell: pwsh
        run: |
          $configVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = [regex]::Match((Get-Content src-tauri/Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($cargoVersion -ne $configVersion) { throw "tauri.conf.json ($configVersion) and Cargo.toml ($cargoVersion) versions differ." }
          if ($packageVersion -ne $configVersion) { throw "tauri.conf.json ($configVersion) and package.json ($packageVersion) versions differ." }
          if ($env:GITHUB_REF_NAME -ne "v$configVersion") { throw "Tag $env:GITHUB_REF_NAME must match app version v$configVersion." }

      - name: Build and publish signed installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: OrangeHub ${{ github.ref_name }}
          releaseBody: "Windows 安装包、macOS ARM64/x64 DMG、Linux DEB/RPM 安装包，以及 Windows Tauri 更新清单。"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          assetNamePattern: "[name]-Setup[ext]"

      - name: Prepare portable executable
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "src-tauri\target\release\orangehub.exe"
          $portableDir = Join-Path $env:GITHUB_WORKSPACE "OrangeHub-Portable"
          $portableZip = Join-Path $env:GITHUB_WORKSPACE "OrangeHub-Portable.zip"
          if (-not (Test-Path $source)) { throw "Portable executable was not produced: $source" }
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item -Path $source -Destination (Join-Path $portableDir "OrangeHub.exe") -Force
          Compress-Archive -Path (Join-Path $portableDir "*") -DestinationPath $portableZip -Force

      - name: Upload portable archive to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $legacyAsset = gh release view $env:GITHUB_REF_NAME --json assets --jq '.assets[] | select(.name == "OrangeHub-Portable.exe") | .name' --repo $env:GITHUB_REPOSITORY
          if ($legacyAsset) {
            gh release delete-asset $env:GITHUB_REF_NAME "OrangeHub-Portable.exe" --yes --repo $env:GITHUB_REPOSITORY
          }
          gh release upload $env:GITHUB_REF_NAME "$env:GITHUB_WORKSPACE\OrangeHub-Portable.zip" --clobber --repo $env:GITHUB_REPOSITORY

  release-macos:
    name: Build and publish macOS DMG
    needs: release
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install macOS Tauri CLI binding
        run: npm install --no-save --package-lock=false --ignore-scripts @tauri-apps/cli-darwin-arm64@2.12.3

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Prepare macOS signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_CERTIFICATE:-}" ]]; then
            echo "No Apple Developer certificate configured; using an explicit ad-hoc signature."
            exit 0
          fi
          if [[ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]]; then
            echo "APPLE_CERTIFICATE_PASSWORD is required when APPLE_CERTIFICATE is configured."
            exit 1
          fi
          if [[ -z "${APPLE_ID:-}" || -z "${APPLE_PASSWORD:-}" || -z "${APPLE_TEAM_ID:-}" ]] &&
             [[ -z "${APPLE_API_KEY:-}" || -z "${APPLE_API_ISSUER:-}" || -z "${APPLE_API_KEY_PATH:-}" ]]; then
            echo "Developer ID builds must also provide Apple notarization credentials."
            exit 1
          fi

      - name: Build macOS ARM64 DMG
        shell: bash
        run: |
          set -euo pipefail
          tauri_args=(--target aarch64-apple-darwin --bundles dmg)
          if [[ -z "${APPLE_CERTIFICATE:-}" ]]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
              APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_PATH
            export APPLE_SIGNING_IDENTITY=-
            tauri_args+=(--config '{"bundle":{"macOS":{"signingIdentity":"-","hardenedRuntime":false}}}')
          elif [[ -z "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            unset APPLE_SIGNING_IDENTITY
          fi
          npx tauri build "${tauri_args[@]}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}

      - name: Build macOS x64 DMG
        shell: bash
        run: |
          set -euo pipefail
          tauri_args=(--target x86_64-apple-darwin --bundles dmg)
          if [[ -z "${APPLE_CERTIFICATE:-}" ]]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
              APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_PATH
            export APPLE_SIGNING_IDENTITY=-
            tauri_args+=(--config '{"bundle":{"macOS":{"signingIdentity":"-","hardenedRuntime":false}}}')
          elif [[ -z "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            unset APPLE_SIGNING_IDENTITY
          fi
          npx tauri build "${tauri_args[@]}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}

      - name: Verify macOS code signatures
        shell: bash
        run: |
          set -euo pipefail
          verify_dmg() {
            local dmg="$1"
            local mount_point
            local app

            mount_point="$(mktemp -d)"
            hdiutil attach "$dmg" \
              -nobrowse \
              -readonly \
              -noverify \
              -mountpoint "$mount_point" >/dev/null
            app=""
            for candidate in "$mount_point"/*.app; do
              if [[ -d "$candidate" ]]; then
                app="$candidate"
                break
              fi
            done
            if [[ -z "$app" ]]; then
              hdiutil detach "$mount_point" -force >/dev/null || true
              rm -rf "$mount_point"
              echo "No app bundle found in DMG: $dmg"
              exit 1
            fi
            codesign --verify --deep --strict --verbose=2 "$app"
            hdiutil detach "$mount_point" >/dev/null
            rm -rf "$mount_point"
          }

          arm_dmg=""
          for candidate in src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg; do
            if [[ -f "$candidate" ]]; then
              arm_dmg="$candidate"
              break
            fi
          done
          x64_dmg=""
          for candidate in src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg; do
            if [[ -f "$candidate" ]]; then
              x64_dmg="$candidate"
              break
            fi
          done
          if [[ -z "$arm_dmg" || -z "$x64_dmg" ]]; then
            echo "Expected ARM64 and x64 DMGs were not produced."
            exit 1
          fi
          verify_dmg "$arm_dmg"
          verify_dmg "$x64_dmg"

      - name: Upload macOS package to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          arm_dmg_files=(src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          x64_dmg_files=(src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg)
          if [[ ${#arm_dmg_files[@]} -ne 1 || ${#x64_dmg_files[@]} -ne 1 ]]; then
            echo "Expected one ARM64 DMG and one x64 DMG; found ${#arm_dmg_files[@]} and ${#x64_dmg_files[@]}"
            exit 1
          fi
          arm_asset="OrangeHub-${GITHUB_REF_NAME}-macOS-arm64.dmg"
          x64_asset="OrangeHub-${GITHUB_REF_NAME}-macOS-x64.dmg"
          cp "${arm_dmg_files[0]}" "$arm_asset"
          cp "${x64_dmg_files[0]}" "$x64_asset"
          gh release upload "$GITHUB_REF_NAME" "$arm_asset" "$x64_asset" --clobber --repo "$GITHUB_REPOSITORY"

  release-linux:
    name: Build and publish Linux packages
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential curl file libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev \
            patchelf rpm wget

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Linux Tauri CLI binding
        run: npm install --no-save --package-lock=false --ignore-scripts @tauri-apps/cli-linux-x64-gnu@2.12.3

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux DEB and RPM packages
        run: npx tauri build --bundles deb,rpm
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Linux packages to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          deb_files=(src-tauri/target/release/bundle/deb/*.deb)
          rpm_files=(src-tauri/target/release/bundle/rpm/*.rpm)
          if [[ ${#deb_files[@]} -ne 1 || ${#rpm_files[@]} -ne 1 ]]; then
            echo "Expected one DEB and one RPM package; found ${#deb_files[@]} DEB and ${#rpm_files[@]} RPM"
            exit 1
          fi
          deb_asset="OrangeHub-${GITHUB_REF_NAME}-Linux-x86_64.deb"
          rpm_asset="OrangeHub-${GITHUB_REF_NAME}-Linux-x86_64.rpm"
          cp "${deb_files[0]}" "$deb_asset"
          cp "${rpm_files[0]}" "$rpm_asset"
          gh release upload "$GITHUB_REF_NAME" "$deb_asset" "$rpm_asset" --clobber --repo "$GITHUB_REPOSITORY"
