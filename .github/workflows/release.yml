name: Release OrangeHub

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release versions
        shell: pwsh
        run: |
          $configVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = [regex]::Match((Get-Content src-tauri/Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($cargoVersion -ne $configVersion) { throw "tauri.conf.json ($configVersion) and Cargo.toml ($cargoVersion) versions differ." }
          if ($packageVersion -ne $configVersion) { throw "tauri.conf.json ($configVersion) and package.json ($packageVersion) versions differ." }
          if ($env:GITHUB_REF_NAME -ne "v$configVersion") { throw "Tag $env:GITHUB_REF_NAME must match app version v$configVersion." }

      - name: Build and publish signed installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: OrangeHub ${{ github.ref_name }}
          releaseBody: "Windows 安装包和 Tauri 更新清单。"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          assetNamePattern: "[name]-Setup[ext]"

      - name: Prepare portable executable
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "src-tauri\target\release\orangehub.exe"
          $portable = Join-Path $env:GITHUB_WORKSPACE "OrangeHub-Portable.exe"
          if (-not (Test-Path $source)) { throw "Portable executable was not produced: $source" }
          Copy-Item -Path $source -Destination $portable -Force

      - name: Upload portable executable to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload $env:GITHUB_REF_NAME "$env:GITHUB_WORKSPACE\OrangeHub-Portable.exe" --clobber --repo $env:GITHUB_REPOSITORY
